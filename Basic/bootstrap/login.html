<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITCART|Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <nav class="nav">
        <a class="nav-link active mt-4 mx-5" style="font-size: 18px;" aria-current="page" href="index.html">Home</a>
        
    </nav>
    <div class="row ">
            <!-- main content  -->
            <div class="col-3 my-2  shadow-lg rounded  my-3 mx-auto ">
                <form class="p-3">
                    <h4 class="  col-4 mx-auto">Login</h4>
                     <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" aria-describedby="usernameHelp">
                        
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password">
                    </div>
                    
                    
                    <button type="submit" class="btn btn-primary">Login</button>
                    <h6 class=" mt-4">Not a user? <a href="register.html">Register</a></h6>
                    
                </form>
            </div>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
